services:
  # Database for the project data warehouse
  postgres:
    image: postgres:15
    container_name: mkt_intelligence_postgres
    ports:
      - "5434:5432" # Different port to avoid conflicts
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Reusable Airflow service configuration
  x-airflow-common: &airflow-common
    build:
      context: .
      dockerfile: Dockerfile
    user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
    environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB}
        POSTGRES_HOST: ${POSTGRES_HOST}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_PORT: ${POSTGRES_PORT}

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - ${SPREADSHEET_PATH}:/opt/airflow/data


  # Airflow initialization
  airflow-init:
    <<: *airflow-common
    container_name: mkt_intel_airflow-init
    entrypoint: /entrypoint
    command: >
      bash -c '
      airflow db migrate;
      airflow users create 
      --username ${AIFLOW_USER}
      --password ${AIFLOW_PASSWORD} 
      --firstname ${AIRFLOW_FIRST_NAME} 
      --lastname ${AIRFLOW_LAST_NAME}
      --role Admin 
      --email ${AIRFLOW_EMAIL}'
    user: "0:0"
    depends_on:
      postgres_airflow:
        condition: service_healthy

  # Airflow webserver
  airflow-webserver:
    <<: *airflow-common
    container_name: mkt_intel_airflow-webserver
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: mkt_intel_airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Database to airflow metadata
  postgres_airflow:
    image: postgres:15
    container_name: mkt_int_airflow_postgres
    environment:
      POSTGRES_DB: ${AIRFLOW_DB}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_airflow_data: